services:
  - type: web
    name: interviewx-ai-api
    runtime: docker
    rootDir: backend
    plan: free
    healthCheckPath: /health
    envVars:
      - key: APP_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: interviewx-ai-db
          property: connectionString
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: JWT_ALGORITHM
        value: HS256
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: 1440
      - key: FRONTEND_ORIGIN
        value: https://interviewx-ai-web.onrender.com
      - key: UPLOAD_STORAGE_DIR
        value: /app/storage/uploads
      - key: REPORT_STORAGE_DIR
        value: /app/storage/reports

  - type: web
    name: interviewx-ai-web
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: frontend/dist
    envVars:
      - key: VITE_API_BASE_URL
        value: https://interviewx-ai-api.onrender.com

databases:
  - name: interviewx-ai-db
    plan: free
